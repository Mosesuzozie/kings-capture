name: Build KingCapture

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Restore Java source from committed source archive
        run: |
          mkdir -p /tmp/kingcapture-source
          cat source-archive/part-*.b64 | base64 --decode > /tmp/kingcapture-source.zip
          unzip -t /tmp/kingcapture-source.zip
          unzip -oq /tmp/kingcapture-source.zip -d /tmp/kingcapture-source
          test -d /tmp/kingcapture-source/src/main/java
          cp -a /tmp/kingcapture-source/src .

      - name: Commit normal source tree to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/
          git rm -r source-archive/
          if ! git diff --cached --quiet; then
            git commit -m "Add KingCapture Java source tree"
            git push origin HEAD:main
          fi

      - name: Build KingCapture
        run: gradle --no-daemon clean build

      - name: Verify installable JAR exists
        run: |
          echo "Generated JAR files:"
          ls -lah build/libs/
          test -s build/libs/kingcapture-1.0.0.jar
          jar tf build/libs/kingcapture-1.0.0.jar | grep -q 'fabric.mod.json'

      - name: Upload installable mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: KingCapture-1.0.0
          path: build/libs/kingcapture-1.0.0.jar
          if-no-files-found: error
          retention-days: 14
