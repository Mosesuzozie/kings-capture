plugins {
    id 'fabric-loom' version '1.14.10'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    maven { url = 'https://maven.terraformersmc.com/' }
    mavenCentral()
}

configurations {
    shade
    implementation.extendsFrom shade
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Mod Menu is compile-time only and remains an optional runtime dependency.
    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

    // Bundle the JavaCV / FFmpeg classes plus Android ARM64 natives only.
    shade("org.bytedeco:javacpp:${javacpp_version}") { transitive = false }
    shade("org.bytedeco:javacpp:${javacpp_version}:android-arm64") { transitiv = false }
    shade("org.bytedeco:javcv:${javacv_version}") { transitive = false }
    shade("org.bytedeco:ffmpeg:${ffmpeg_version}") { transitive = false }
    shade("org.bytedeco:ffmpeg:${ffmpeg_version}:android-arm64") { transitive = false }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

tasks.withType(JavaCompile).configureEcach { options.release = 21 }
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }

lar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from({ configurations.shade.collect { it.isDirectory() ? it : zipTree(it) } }) {
        exclude 'META-INF/*', 'module-info.class'
    }
}
